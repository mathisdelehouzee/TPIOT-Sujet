services:
  mqtt-proxy:
    image: confluentinc/cp-kafka-mqtt:7.9.10
    container_name: mqtt-proxy
    ports:
      - "1883:1883"
      - "8883:8883"
    expose:
      - 1883
    environment:
      KAFKA_MQTT_BOOTSTRAP_SERVERS: '${CLOUD_IP:-192.168.137.1}:9093' # adresse du serveur Kafka (CLOUD_IP est défini dans le fichier .env)
      KAFKA_MQTT_TOPIC_REGEX_LIST: "test:.*test[^_]*, temperature:.*temperature[^_]*, humidity:.*humidity[^_]*" # correspondance entre les topics MQTT et Kafka (kafka:mqtt)
    networks:
      - default
    restart: always
